[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperx-ui"
version = "0.1.0"
description = "Local-first WhisperX UI scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "faster-whisper>=1.1.0",
    "huggingface-hub>=0.24.0",
    "pyannote.audio>=3.3.2",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.9",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchcodec",
    "transformers>=4.46.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["whisperx_ui_backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system != 'Darwin'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
